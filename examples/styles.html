<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare styles · Data Viewer</title>
<style>*{box-sizing:border-box}html{color-scheme:light dark;--bg:#f8f8f6;--panel:#fff;--ink:#202927;--muted:#56635e;--line:#bcc7c1;--on:#135e4c}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",sans-serif}main{max-width:1880px;padding:28px clamp(14px,3vw,48px);margin:auto}h1{font:500 clamp(34px,4vw,60px)/1.1 Georgia,serif;letter-spacing:-.035em;margin:.4em 0 .1em}h2{font-size:21px;margin:8px 0 2px}p,small{color:var(--muted)}.top,nav,fieldset{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.top{justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}fieldset{border:0;margin:0;padding:0}nav{gap:16px;margin:18px 0 24px}label{display:flex;gap:7px;align-items:center}select{font:inherit;min-height:38px;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 9px}article{min-width:0}article img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px}article p{margin:3px 0 8px}a{color:var(--on);text-underline-offset:3px}:focus-visible{outline:2px solid var(--ink);outline-offset:3px}.links{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px}article a{display:inline-block;padding:4px 0}
@media(max-width:900px){.grid{grid-template-columns:1fr}.grid article{max-width:760px}select,article a{min-height:44px}}@media(prefers-color-scheme:dark){html{--bg:#192320;--panel:#263430;--ink:#e9efe9;--muted:#b7c7be;--line:#496254;--on:#a5d9bd}}</style>
<main><header class="top"><b>Data Viewer</b><a id="architecture" href="../documentation/dashboard.html#map">Software architecture ↗</a></header>
<h1>Compare styles</h1><p>Compare the same worksheet, laps and cursor position in each style. Open a full-size preview to inspect the traces and controls.</p>
<nav aria-label="Preview settings"><label>Worksheet <select id="view"><option value="history">Channel history</option><option value="scatter">G–G scatter plot</option><option value="timing">Timing Story</option></select></label><label>Theme <select id="tone"><option value="light">Light</option><option value="dark">Dark</option></select></label></nav>
<section class="grid" id="grid" aria-label="Three visual styles"></section></main>
<script>
const styles=[["apple","Apple","Light surfaces and segmented controls."],["soft","Neumorphic","Sage surfaces with softly raised panels and inset controls."],["clean","Clean","Technical drawing paper, crisp dividers and serif headings."]];
const el=id=>document.getElementById(id);
function make(tag,text){const n=document.createElement(tag);if(text)n.textContent=text;return n;}
function render(){el("grid").replaceChildren();for(const [k,name,desc] of styles){
 const v=el("view").value,t=el("tone").value,src="previews/"+k+"-"+t+"-"+v+".png",a=make("article"),img=make("img"),imageLink=make("a");
 img.src=src;img.width=1440;img.height=900;img.alt=el("view").selectedOptions[0].text+" in "+name+", theme: "+el("tone").selectedOptions[0].text;
 imageLink.href=src;imageLink.append(img);imageLink.target="_blank";
 const links=make("div");links.className="links";const full=make("a","Open preview ↗");full.href=src;full.target="_blank";links.append(full);
 if(location.protocol!=="file:"){const live=make("a","Open in viewer");live.href="/workbook?style="+k+"&tone="+t+"&view="+v;links.append(live);}
 a.append(imageLink,make("h2",name),make("p",desc),links);el("grid").append(a);}}
if(location.protocol!=="file:")el("architecture").href="/architecture";el("view").onchange=el("tone").onchange=render;render();</script></html>
